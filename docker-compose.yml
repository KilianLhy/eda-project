services:
  taskflow-api:
    build:
      context: ./taskflow-api
    container_name: taskflow-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PORT=${API_PORT:-3000}
      - DATABASE_URL=${API_DATABASE_URL:-postgresql://taskflow:taskflow@postgres:5432/taskflow?schema=public}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-real-env}
    command: sh -c "npm run prisma:migrate:deploy && npm run start:prod"
    ports:
      - "${API_PORT:-3000}:3000"

  taskflow-web:
    build:
      context: ./taskflow-web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: taskflow-web
    environment:
      - PORT=3000
    depends_on:
      - taskflow-api
    ports:
      - "${WEB_PORT:-3001}:3000"

  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-taskflow}
      - POSTGRES_USER=${POSTGRES_USER:-taskflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-taskflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
